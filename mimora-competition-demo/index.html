<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f4ec" />
  <meta name="description" content="MIMORA — Không gian học tập ấm áp, kết nối gia đình và nhà trường." />
  <title>MIMORA — Cùng con lớn lên mỗi ngày</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" id="topbar">
      <button class="brand-button" id="brandHome" aria-label="Về trang chủ">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-word">mimora<span>®</span></span>
      </button>
      <div class="topbar-right">
        <span class="demo-pill"><i></i> Bản trải nghiệm demo</span>
        <button class="sound-toggle" id="fxToggle" aria-pressed="false" title="Bật hoặc tắt âm thanh nút bấm">♪ Âm bấm: Tắt</button>
        <button class="sound-toggle" id="musicToggle" aria-pressed="false" title="Bật hoặc tắt nhạc nền nhẹ">♫ Nhạc nền: Tắt</button>
        <button class="icon-button" id="resetDemo" title="Đặt lại kịch bản demo" aria-label="Đặt lại demo">↻</button>
        <button class="role-chip hidden" id="switchRole">← Chọn vai trò</button>
      </div>
    </header>

    <main id="main" class="main-content" tabindex="-1"></main>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <div id="modalRoot"></div>
    <footer class="site-footer"><span>© MIMORA</span><span>Học tập bằng sự thấu hiểu và đồng hành.</span><span>Dữ liệu mô phỏng · Không phải hệ thống production</span></footer>
  </div>
  <script src="app.js"></script>
  <script src="enhancements.js"></script>
</body>
</html>
